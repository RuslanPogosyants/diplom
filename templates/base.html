<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Video Intelligence System{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #2d2d2d;
            --accent-red: #dc2626;
            --accent-green: #16a34a;
            --accent-blue: #2563eb;
            --accent-orange: #f59e0b;
            --bg-dark: #1a1a1a;
            --bg-medium: #2d2d2d;
            --bg-light: #f5f5f5;
            --text-primary: #1a1a1a;
            --text-secondary: #6b7280;
            --border-color: #e5e5e5;
        }

        * {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        }

        body {
            background: #f5f5f5;
            min-height: 100vh;
            padding-bottom: 50px;
            color: var(--text-primary);
        }

        .navbar {
            background: #ffffff !important;
            border-bottom: 2px solid var(--border-color);
            box-shadow: none;
        }

        .navbar-brand {
            font-weight: 600;
            font-size: 1.25rem;
            color: var(--text-primary) !important;
            letter-spacing: -0.5px;
        }

        .navbar-brand:hover {
            color: var(--accent-red) !important;
        }

        .main-container {
            margin-top: 30px;
        }

        .card {
            border: 1px solid var(--border-color);
            border-radius: 4px;
            box-shadow: none;
            transition: border-color 0.2s ease;
            background: white;
        }

        .card:hover {
            border-color: var(--accent-red);
        }

        .card-header {
            background: var(--bg-dark);
            color: white;
            border: none;
            border-radius: 4px 4px 0 0 !important;
            padding: 1rem 1.5rem;
            font-weight: 600;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge {
            padding: 0.35rem 0.75rem;
            border-radius: 2px;
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge.bg-success {
            background: var(--accent-green) !important;
        }

        .badge.bg-danger {
            background: var(--accent-red) !important;
        }

        .badge.bg-warning {
            background: var(--accent-orange) !important;
            color: white !important;
        }

        .badge.bg-info {
            background: var(--accent-blue) !important;
        }

        .stat-card {
            background: white;
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--accent-red);
            border-radius: 4px;
            padding: 1.5rem;
            text-align: left;
            margin-bottom: 20px;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            margin: 10px 0;
            font-family: 'Courier New', monospace;
            color: var(--text-primary);
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .btn-primary {
            background: var(--accent-red);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 2px;
            font-weight: 600;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background 0.2s ease;
        }

        .btn-primary:hover {
            background: #b91c1c;
        }

        .btn-secondary {
            background: var(--bg-medium);
            border: none;
            color: white;
        }

        .btn-secondary:hover {
            background: var(--bg-dark);
        }

        .timeline-item {
            position: relative;
            padding-left: 40px;
            margin-bottom: 30px;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: 10px;
            top: 0;
            bottom: -30px;
            width: 2px;
            background: var(--border-color);
        }

        .timeline-dot {
            position: absolute;
            left: 6px;
            top: 5px;
            width: 10px;
            height: 10px;
            border-radius: 0;
            background: var(--accent-red);
            border: none;
        }

        .segment-card {
            background: white;
            border: 1px solid var(--border-color);
            border-left: 3px solid var(--accent-blue);
            padding: 1.5rem;
            margin-bottom: 1rem;
            border-radius: 2px;
            transition: border-left-color 0.2s ease;
        }

        .segment-card:hover {
            border-left-color: var(--accent-red);
        }

        .question-card {
            background: white;
            border: 1px solid var(--border-color);
            border-left: 3px solid var(--accent-orange);
            padding: 1.5rem;
            margin-bottom: 1rem;
            border-radius: 2px;
        }

        .term-badge {
            background: var(--bg-medium);
            color: white;
            padding: 0.4rem 0.8rem;
            border-radius: 2px;
            margin: 0.25rem;
            display: inline-block;
            font-size: 0.8rem;
            font-family: 'Courier New', monospace;
            font-weight: 500;
        }

        .article-card {
            background: white;
            border: 1px solid var(--border-color);
            padding: 1.5rem;
            margin-bottom: 1rem;
            border-radius: 2px;
            transition: border-color 0.2s ease;
        }

        .article-card:hover {
            border-color: var(--accent-red);
        }

        .nav-pills .nav-link {
            color: var(--text-secondary);
            font-weight: 500;
            border-radius: 2px;
            padding: 0.75rem 1.5rem;
            margin: 0 0.25rem;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }

        .nav-pills .nav-link.active {
            background: var(--bg-dark);
            color: white;
            border-color: var(--bg-dark);
        }

        .progress {
            height: 4px;
            border-radius: 0;
            background: var(--border-color);
        }

        .progress-bar {
            background: var(--accent-red);
            border-radius: 0;
        }

        .footer {
            margin-top: 50px;
            padding: 30px 0;
            text-align: center;
            color: var(--text-secondary);
            border-top: 1px solid var(--border-color);
            background: white;
        }

        .alert {
            border: 1px solid;
            border-radius: 2px;
            padding: 1rem 1.25rem;
        }

        .alert-success {
            background: #f0fdf4;
            border-color: var(--accent-green);
            color: #166534;
        }

        .alert-danger {
            background: #fef2f2;
            border-color: var(--accent-red);
            color: #991b1b;
        }

        .alert-warning {
            background: #fffbeb;
            border-color: var(--accent-orange);
            color: #92400e;
        }

        .alert-info {
            background: #eff6ff;
            border-color: var(--accent-blue);
            color: #1e40af;
        }

        .timestamp {
            background: var(--bg-dark);
            color: white;
            padding: 0.4rem 0.8rem;
            border-radius: 2px;
            font-family: 'Courier New', monospace;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .table {
            font-size: 0.9rem;
        }

        .table thead th {
            background: var(--bg-light);
            border-bottom: 2px solid var(--border-color);
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        code {
            background: var(--bg-dark);
            color: #f5f5f5;
            padding: 0.2rem 0.4rem;
            border-radius: 2px;
            font-size: 0.875rem;
        }

        pre {
            background: var(--bg-dark);
            color: #f5f5f5;
            padding: 1rem;
            border-radius: 2px;
            border: 1px solid #3a3a3a;
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/">
                VIDEO INTELLIGENCE SYSTEM
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">
                            Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/process">
                            Process
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="https://github.com/RuslanPogosyants/diplom" target="_blank">
                            Docs
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container main-container">
        {% block content %}{% endblock %}
    </div>

    <!-- Footer -->
    <div class="footer">
        <div class="container">
            <p class="mb-0">
                <i class="bi bi-cpu"></i>
                Powered by AI • <strong>GigaChat</strong> • Whisper • T5 • SpaCy • Sentence Transformers
            </p>
            <p class="mt-2" style="font-size: 0.9rem;">
                © 2024 Video Intelligence System
            </p>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    {% block extra_js %}{% endblock %}
</body>
</html>
