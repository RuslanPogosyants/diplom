<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Video Intelligence System{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Утонченный функциональный стиль */
            --primary-color: #8a8a8a;
            --secondary-color: #242424;
            --accent-color: #6a6a6a;
            --success-color: #7a9d7a;
            --danger-color: #9d7a7a;
            --warning-color: #9d9d7a;
            --info-color: #7a9d9d;
            --bg-dark: #1a1a1a;
            --bg-medium: #242424;
            --bg-light: #1a1a1a;
            --border-color: #333333;
            --text-primary: #f5f5f0;
            --text-secondary: #a0a0a0;
            --text-muted: #707070;
        }

        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background: var(--bg-light);
            min-height: 100vh;
            padding-bottom: 50px;
            color: var(--text-primary);
        }

        .navbar {
            background: var(--bg-dark) !important;
            border-bottom: 1px solid var(--border-color);
            box-shadow: none;
        }

        .navbar-brand {
            font-weight: 500;
            font-size: 1.1rem;
            color: var(--text-primary) !important;
            letter-spacing: 0;
        }

        .navbar-brand i {
            color: var(--text-secondary);
            margin-right: 0.5rem;
        }

        .nav-link {
            color: var(--text-secondary) !important;
            transition: color 0.2s;
            font-size: 0.95rem;
        }

        .nav-link:hover {
            color: var(--text-primary) !important;
        }

        .main-container {
            margin-top: 30px;
        }

        .card {
            border: 1px solid var(--border-color);
            border-radius: 2px;
            box-shadow: none;
            transition: none;
            background: var(--bg-medium);
        }

        .card:hover {
            border-color: var(--border-color);
        }

        .card-header {
            background: var(--bg-dark);
            color: var(--text-primary);
            border: none;
            border-radius: 2px 2px 0 0 !important;
            padding: 0.75rem 1.25rem;
            font-weight: 500;
            letter-spacing: 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
        }

        .card-body {
            color: var(--text-primary);
            background: var(--bg-medium);
        }

        .badge {
            padding: 0.3rem 0.6rem;
            border-radius: 2px;
            font-weight: 400;
            font-size: 0.75rem;
        }

        .badge.bg-success {
            background: var(--success-color) !important;
            color: var(--text-primary);
            border: none;
        }

        .badge.bg-warning {
            background: var(--warning-color) !important;
            color: var(--bg-dark);
            border: none;
        }

        .badge.bg-danger {
            background: var(--danger-color) !important;
            color: var(--text-primary);
            border: none;
        }

        .stat-card {
            background: var(--bg-dark);
            color: var(--text-primary);
            border-radius: 2px;
            border: 1px solid var(--border-color);
            padding: 1.25rem;
            text-align: center;
            margin-bottom: 20px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 500;
            margin: 8px 0;
            color: var(--text-primary);
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: var(--bg-dark);
            border: 1px solid var(--accent-color);
            color: var(--text-primary);
            padding: 0.6rem 1.2rem;
            border-radius: 2px;
            font-weight: 400;
            transition: all 0.2s ease;
            font-size: 0.9rem;
        }

        .btn-primary:hover {
            background: var(--bg-medium);
            border-color: var(--primary-color);
            color: var(--text-primary);
        }

        .timeline-item {
            position: relative;
            padding-left: 40px;
            margin-bottom: 30px;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: 10px;
            top: 0;
            bottom: -30px;
            width: 1px;
            background: var(--border-color);
        }

        .timeline-dot {
            position: absolute;
            left: 5px;
            top: 5px;
            width: 10px;
            height: 10px;
            border-radius: 1px;
            background: var(--bg-dark);
            border: 3px solid var(--accent-color);
        }

        .segment-card {
            background: var(--bg-medium);
            border: 1px solid var(--border-color);
            border-left: 2px solid var(--accent-color);
            padding: 1.5rem;
            margin-bottom: 1rem;
            border-radius: 2px;
        }

        .segment-card:hover {
            background: var(--bg-medium);
            border-left-color: var(--primary-color);
        }

        .question-card {
            background: var(--bg-medium);
            border: 1px solid var(--border-color);
            border-left: 2px solid var(--accent-color);
            padding: 1.5rem;
            margin-bottom: 1rem;
            border-radius: 2px;
        }

        .term-badge {
            background: transparent;
            color: var(--text-secondary);
            padding: 0.4rem 0.8rem;
            border-radius: 2px;
            margin: 0.25rem;
            display: inline-block;
            font-size: 0.85rem;
            border: 1px solid var(--border-color);
        }

        .term-badge:hover {
            background: var(--bg-dark);
            color: var(--text-primary);
            border-color: var(--accent-color);
        }

        .article-card {
            background: var(--bg-medium);
            border: 1px solid var(--border-color);
            padding: 1.5rem;
            margin-bottom: 1rem;
            border-radius: 2px;
        }

        .article-card:hover {
            border-color: var(--accent-color);
        }

        .nav-pills .nav-link {
            color: var(--text-secondary);
            font-weight: 400;
            border-radius: 2px;
            padding: 0.75rem 1.5rem;
            margin: 0 0.25rem;
            transition: all 0.2s ease;
            border: 1px solid var(--border-color);
            background: var(--bg-medium);
        }

        .nav-pills .nav-link.active {
            background: var(--bg-dark);
            color: var(--text-primary);
            border-color: var(--accent-color);
        }

        .nav-pills .nav-link:hover {
            border-color: var(--accent-color);
            color: var(--text-primary);
        }

        .progress {
            height: 6px;
            border-radius: 0;
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        .progress-bar {
            background: var(--primary-color);
            border-radius: 0;
            transition: width 0.3s ease;
        }

        .footer {
            margin-top: 50px;
            padding: 30px 0;
            text-align: center;
            color: var(--text-secondary);
            background: var(--bg-dark);
            border-top: 1px solid var(--border-color);
        }

        .footer p {
            color: var(--text-secondary);
            margin-bottom: 0;
        }

        .alert {
            border: 1px solid var(--border-color);
            border-radius: 2px;
            padding: 1.25rem;
            background: var(--bg-medium);
            color: var(--text-primary);
        }

        .alert-success {
            border-left: 2px solid var(--success-color);
        }

        .alert-danger {
            border-left: 2px solid var(--danger-color);
        }

        .alert-info {
            border-left: 2px solid var(--info-color);
        }

        .alert-warning {
            border-left: 2px solid var(--warning-color);
        }

        .timestamp {
            background: transparent;
            color: var(--text-secondary);
            padding: 0.4rem 0.8rem;
            border-radius: 2px;
            font-size: 0.85rem;
            font-weight: 400;
            border: 1px solid var(--border-color);
            display: inline-block;
        }

        /* Дополнительные технические элементы */
        .form-control, .form-select {
            background: var(--bg-medium);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: 2px;
        }

        .form-control:focus, .form-select:focus {
            background: var(--bg-dark);
            border-color: var(--accent-color);
            color: var(--text-primary);
            box-shadow: none;
        }

        .form-label {
            color: var(--text-primary);
            font-weight: 400;
            margin-bottom: 0.5rem;
        }

        .btn {
            border-radius: 2px;
            font-weight: 400;
            transition: all 0.2s ease;
        }

        .btn-success {
            background: var(--bg-medium);
            border: 1px solid var(--accent-color);
            color: var(--text-primary);
        }

        .btn-success:hover {
            background: var(--bg-dark);
            color: var(--text-primary);
            border-color: var(--primary-color);
        }

        .btn-danger {
            background: var(--bg-medium);
            border: 1px solid var(--accent-color);
            color: var(--text-primary);
        }

        .btn-danger:hover {
            background: var(--bg-dark);
            color: var(--text-primary);
            border-color: var(--danger-color);
        }

        /* Заголовки и ссылки */
        h1, h2, h3, h4, h5, h6 {
            color: var(--text-primary);
            font-weight: 500;
            letter-spacing: 0;
        }

        a {
            color: var(--text-secondary);
            text-decoration: underline;
        }

        a:hover {
            color: var(--text-primary);
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 0;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-color);
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-play-circle-fill"></i>
                Video Intelligence System
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">
                            <i class="bi bi-house-door"></i> Главная
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/process">
                            <i class="bi bi-plus-circle"></i> Обработать
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="https://github.com" target="_blank">
                            <i class="bi bi-github"></i> GitHub
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container main-container">
        {% block content %}{% endblock %}
    </div>

    <!-- Footer -->
    <div class="footer">
        <div class="container">
            <p class="mb-0">
                <i class="bi bi-cpu"></i>
                Powered by AI • Whisper • T5 • SpaCy • Sentence Transformers
            </p>
            <p class="mt-2" style="font-size: 0.9rem;">
                © 2024 Video Intelligence System
            </p>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    {% block extra_js %}{% endblock %}
</body>
</html>
